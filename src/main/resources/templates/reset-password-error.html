<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Link Problem – ClimbUp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #74ebd5, #9face6);
      font-family: 'Poppins', sans-serif;
    }
    .auth-container {
      max-width: 500px;
      margin: 80px auto;
      background: rgba(255,255,255,0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 8px 32px rgba(0,0,0,0.2);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h3 class="mb-3">Reset link problem</h3>
    <p class="text-danger" th:text="${error}">Invalid or expired token</p>
    <p class="text-muted">Reset links work for one hour and only once. Request a new one below.</p>
    <a class="btn btn-primary mt-2" th:href="@{/auth/forgot-password}">Request a new link</a>
    <div class="mt-3"><a th:href="@{/auth/login}">Back to login</a></div>
  </div>
</body>
</html>
