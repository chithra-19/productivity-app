# SERVER
server.port=${PORT:8080}

# ACTIVE PROFILE (IMPORTANT FIX)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PUBLIC URL (used in password-reset emails). Set APP_BASE_URL on Render.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Email over HTTPS (used on Render, where SMTP ports are blocked). Leave BREVO_API_KEY unset locally.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=ClimbUp

app.remember-me-key=${REMEMBER_ME_KEY:}


# Mail: give up after 5 seconds instead of hanging when SMTP cannot be reached
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JPA
# Store/read timestamps in UTC regardless of the JVM time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# LOGGING 
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=INFO

# THYMELEAF
spring.thymeleaf.cache=true


spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
